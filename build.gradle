plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = project.archives_base_name }

repositories {
    // Loom adds the Minecraft/library repositories itself.
}

loom {
    splitEnvironmentSourceSets()
    mods {
        ghostpath {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'ghostpath-gametest'
        eula = true
        enableClientGameTests = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// ./gradlew runGameTest -PgtFilter=<regex>  runs only the game tests whose id matches (Fabric's fabric-api.gametest.filter)
tasks.matching { it.name == 'runGameTest' }.configureEach {
    // a fresh world for every run: the old one kept every earlier run's chunks and entities (4.8 GB after two days), so
    // a test could meet what another run left behind, and the result depended on the history of the checkout
    doFirst { delete file('build/run/gameTest/world') }
    if (project.hasProperty('gtFilter')) {
        systemProperty 'fabric-api.gametest.filter', project.property('gtFilter')
    }
}
